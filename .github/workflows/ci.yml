# Supported: PHP >=8.2, Symfony ^7.4 || ^8.0 (Symfony 8 needs PHP 8.4).
# The lowest job installs the oldest allowed versions. The current job runs the linters,
# coverage and SonarCloud; the other jobs only run the tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # every Monday, to catch breakage from new dependency releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}${{ matrix.lowest && ' - lowest' || '' }}
    runs-on: ubuntu-latest
    environment: main # holds SONAR_TOKEN
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', symfony: '7.4.*', lowest: true }
          - { php: '8.3', symfony: '7.4.*' }
          - { php: '8.4', symfony: '8.*', current: true }
          - { php: '8.5', symfony: '8.*' }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: ${{ matrix.current && '0' || '1' }} # SonarCloud needs the full history

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.current && 'xdebug' || 'none' }}
          tools: flex

      - name: Get the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.lowest && 'lowest' || 'stable' }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.symfony }}-${{ matrix.lowest && 'lowest' || 'stable' }}-

      - name: Install dependencies
        env:
          SYMFONY_REQUIRE: ${{ matrix.symfony }}
        run: |
          # php-cs-fixer cannot install on the lowest Symfony versions, and only the current job lints
          if [ "${{ matrix.current }}" != "true" ]; then composer remove --dev --no-update friendsofphp/php-cs-fixer; fi
          composer update --no-interaction --no-progress --prefer-dist --prefer-stable ${{ matrix.lowest && '--prefer-lowest --no-security-blocking' || '' }}

      - name: PHP-CS-Fixer
        if: matrix.current
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --ansi

      - name: PHP_CodeSniffer
        if: matrix.current
        run: vendor/bin/phpcs --report=code

      - name: PHPStan
        if: matrix.current
        run: vendor/bin/phpstan analyse src tests --level 7 --no-progress --error-format=github

      - name: PHPUnit
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: vendor/bin/phpunit ${{ matrix.current && '--coverage-clover=build/coverage.xml' || '--no-coverage' }}

      - name: SonarCloud
        # secrets are not available to pull requests from forks
        if: matrix.current && github.event.pull_request.head.repo.fork != true
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
